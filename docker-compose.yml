# Redis for the cache and the rate limiter: docker compose up -d redis
# Then run with SPRING_PROFILES_ACTIVE=dev,redis
services:
  redis:
    image: redis:7.2-alpine
    container_name: meridian-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
